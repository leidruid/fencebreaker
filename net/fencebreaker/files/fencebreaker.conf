# fencebreaker: multi-tenant policy routing
# Документация полей: docs/CONTRACTS.md; управление: LuCI → Сеть → fencebreaker

config fencebreaker 'global'
	option enabled '1'
	# Период обновления geoip базы (часы; 0 — только вручную)
	option geodata_refresh '168'
	# Период обновления URL-списков по умолчанию (часы)
	option lists_refresh '24'
	# Порт единственного CoreDNS-инстанса (перехват DNS уходит сюда)
	option coredns_port '1053'
	# TTL обученных адресов в nft-наборах: минимум/максимум (секунды)
	option ttl_min '300'
	option ttl_max '86400'
	# Продлевать timeout повторными ответами при остатке < N% (0 — не продлевать)
	option dns_refresh_on_remain_pct '0'
	# Лимит обученного набора на тенанта
	option max_set_size '65536'
	# Период ресинхронизации зеркал наборов в плагине (секунды)
	option resync_interval '60'

# Пример тенанта: гостевая сеть через второй WAN-провайдер
config tenant
	option id 'guest'
	option name 'Guest'
	option enabled '0'
	# Канал: interface (uci-имя сети) или vless
	option egress_mode 'interface'
	option egress_interface 'wan2'
	# Поведение при недоступности канала: main (резерв через основную таблицу)
	# или strict (блокировать трафик тенанта)
	option fallback 'main'
	# select: проксировать только перечисленное; invert: всё, кроме исключений
	option routing_mode 'select'
	list include_subnets '203.0.113.0/24'
	list include_domains 'example.com'
	list include_geoip 'ru'
	#list include_lists 'blocked'
	list exclude_subnets '198.51.100.0/24'
	list exclude_domains 'bank.example'
	# Обслуживаемые сети: uci-имена интерфейсов, имена устройств или CIDR
	list networks 'guest'
	# Хосты, не затрагиваемые маршрутизацией тенанта (их DNS идёт в dnsmasq)
	list excluded_hosts '192.168.1.10'
	# Хосты, всегда идущие через канал тенанта
	list full_hosts '192.168.1.11'
	# Перехватывать DNS (порт 53) клиентов тенанта; отключать только если
	# понимаете, что обучение по доменам перестанет работать
	option dns_hijack '1'
	# Запросы upstream DNS тенанта идут через его канал
	option dns_via_tunnel '1'
	# Продление адресов доменов: фоновый перезапрос изученных доменов до
	# истечения TTL, чтобы маршрутизация не прерывалась (default 0)
	option dns_keepalive '1'
	list dns_upstream '1.1.1.1'

